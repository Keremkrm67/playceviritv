# SPDX-License-Identifier: AGPL-3.0-only
# PlayCeviri TV: Windows kurulum dosyası, Android TV uygulaması gömülü olarak (TV'ye ADB ile kurulsun diye).
# Sürüm etiketi ve Mac imzası gerektirmez; çıktılar çalışmanın "Artifacts" bölümündedir.
name: playceviri-windows

on:
  push:
    branches: [playceviri-tv]
  workflow_dispatch:

jobs:
  android:
    uses: ./.github/workflows/tv-android.yml
    secrets: inherit

  windows:
    needs: android
    uses: ./.github/workflows/windows.yml
    with:
      with-android: true
